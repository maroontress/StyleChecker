name: Markdown Lint CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v6
    - uses: DavidAnson/markdownlint-cli2-action@v24
      with:
        globs: 'doc/rules/*.md'
